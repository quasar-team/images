workflow:
  rules:
    - if: $CI_COMMIT_TAG
      when: always
    - if: $CI_PIPELINE_SOURCE == "api"
      when: always
    - if: $CI_PIPELINE_SOURCE == "schedule"
      when: always
    - when: never

stages:
  - build

Image Alma 10:
  stage: build
  image: quay.io/buildah/stable
  variables:
    BUILDAH_FORMAT: docker
  script:
    - echo "$CI_REGISTRY_PASSWORD" | buildah login --username "$CI_REGISTRY_USER" --password-stdin "$CI_REGISTRY"
    - buildah bud --build-arg ICS_REPO_DEPS_TOKEN="$ICS_REPO_DEPS_TOKEN" --file "${CI_PROJECT_DIR}/alma-10/Dockerfile" --tag "${CI_REGISTRY_IMAGE}/alma-10-build:${CI_COMMIT_SHORT_SHA}" "${CI_PROJECT_DIR}/alma-10"
    - buildah push "${CI_REGISTRY_IMAGE}/alma-10-build:${CI_COMMIT_SHORT_SHA}"
    - |
      if [ "$CI_COMMIT_BRANCH" = "main" ]; then
        DATE_TAG="$(date +%Y%m%d)"
        buildah tag "${CI_REGISTRY_IMAGE}/alma-10-build:${CI_COMMIT_SHORT_SHA}" "${CI_REGISTRY_IMAGE}/alma-10-build:latest"
        buildah tag "${CI_REGISTRY_IMAGE}/alma-10-build:${CI_COMMIT_SHORT_SHA}" "${CI_REGISTRY_IMAGE}/alma-10-build:${DATE_TAG}"
        buildah push "${CI_REGISTRY_IMAGE}/alma-10-build:latest"
        buildah push "${CI_REGISTRY_IMAGE}/alma-10-build:${DATE_TAG}"
      fi
      if [ -n "$CI_COMMIT_TAG" ]; then
        buildah tag "${CI_REGISTRY_IMAGE}/alma-10-build:${CI_COMMIT_SHORT_SHA}" "${CI_REGISTRY_IMAGE}/alma-10-build:${CI_COMMIT_TAG}"
        buildah push "${CI_REGISTRY_IMAGE}/alma-10-build:${CI_COMMIT_TAG}"
      fi

Image Windows 2025:
  stage: build
  tags:
    - powershell-win2025
  script:
    - cd w2025
    - .\Create-DotEnv-File.ps1
    - docker login -u $env:CI_REGISTRY_USER -p $env:CI_REGISTRY_PASSWORD $env:CI_REGISTRY
    - docker build --no-cache -t $env:CI_REGISTRY_IMAGE/win2025-build:$env:CI_COMMIT_SHORT_SHA  .
    - docker push $env:CI_REGISTRY_IMAGE/win2025-build:$env:CI_COMMIT_SHORT_SHA
    - |
      if ($env:CI_COMMIT_BRANCH -eq "main") {
        $dateTag = Get-Date -Format "yyyyMMdd"
        docker tag $env:CI_REGISTRY_IMAGE/win2025-build:$env:CI_COMMIT_SHORT_SHA  $env:CI_REGISTRY_IMAGE/win2025-build:latest 
        docker tag $env:CI_REGISTRY_IMAGE/win2025-build:$env:CI_COMMIT_SHORT_SHA  $env:CI_REGISTRY_IMAGE/win2025-build:$dateTag
        docker push "$env:CI_REGISTRY_IMAGE/win2025-build:latest"
        docker push "$env:CI_REGISTRY_IMAGE/win2025-build:$dateTag"
      }
      if ($env:CI_COMMIT_TAG) {
        docker tag $env:CI_REGISTRY_IMAGE/win2025-build:$env:CI_COMMIT_SHORT_SHA  $env:CI_REGISTRY_IMAGE/win2025-build:$env:CI_COMMIT_TAG
        docker push "$env:CI_REGISTRY_IMAGE/win2025-build:$env:CI_COMMIT_TAG"
      }

  
